name: uptask
description: "Application for managing tasks"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.0.0
  go_router: ^14.7.2
  dio: ^5.8.0+1
  dartz: ^0.10.1
  get_it: ^8.0.3
  equatable: ^2.0.7
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: BarlowSemiCondensed
      fonts:
        - asset: assets/fonts/BarlowSemiCondensed-Regular.ttf
        - asset: assets/fonts/BarlowSemiCondensed-Medium.ttf
        - asset: assets/fonts/BarlowSemiCondensed-Bold.ttf
        - asset: assets/fonts/BarlowSemiCondensed-ExtraBold.ttf
